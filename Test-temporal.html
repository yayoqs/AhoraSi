<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahora Sí — Test chico</title>
<style>
  :root {
    --papel: #F7F1E8;
    --papel-2: #EFE7DA;
    --papel-3: #FCF8F0;
    --borde: #E2D7C5;
    --tinta: #1F1B16;
    --tinta-suave: #6B6155;
    --terracota: #C9613B;
    --musgo: #5A6B3E;
    --rojo: #A03737;
    --ok: #4A7C4A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--papel);
    color: var(--tinta);
    font: 400 15px/1.6 system-ui, sans-serif;
    padding: 20px;
  }
  main { max-width: 620px; margin: 0 auto; }
  h1 { color: var(--terracota); font-size: 22px; margin: 0 0 4px; }
  .lead { color: var(--tinta-suave); font-size: 14px; margin: 0 0 20px; }
  #login {
    padding: 20px;
    background: var(--papel-2);
    border: 1px solid var(--borde);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #botones-usuario { display: flex; gap: 10px; }
  .btn-usuario {
    padding: 10px 20px;
    border: 1.5px solid var(--terracota);
    background: transparent;
    color: var(--terracota);
    border-radius: 999px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-usuario[aria-pressed="true"] { background: var(--terracota); color: var(--papel); }
  input {
    padding: 11px 14px;
    font: inherit;
    border-radius: 10px;
    border: 1.5px solid var(--borde);
    background: var(--papel-3);
    width: 100%;
  }
  button.accion {
    padding: 12px 18px;
    border: 0;
    border-radius: 10px;
    background: var(--terracota);
    color: var(--papel);
    font-weight: 600;
    cursor: pointer;
    font-size: 15px;
  }
  #estado { min-height: 1.4em; font-size: 13px; color: var(--tinta-suave); margin: 4px 0 0; }
  .caso {
    padding: 8px 12px;
    margin: 4px 0;
    border-radius: 6px;
    background: var(--papel-2);
    border-left: 3px solid var(--borde);
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .caso.ok { border-left-color: var(--ok); }
  .caso.fallo { border-left-color: var(--rojo); }
  .caso .simbolo { font-weight: 700; flex-shrink: 0; }
  .caso.ok .simbolo { color: var(--ok); }
  .caso.fallo .simbolo { color: var(--rojo); }
  .detalle { color: var(--rojo); font-size: 12px; }
  #resumen {
    margin-top: 16px;
    padding: 12px 16px;
    background: var(--papel-2);
    border-radius: 10px;
    font-weight: 600;
    border-left: 4px solid var(--terracota);
  }
  #resumen.ok { border-left-color: var(--ok); }
  #resumen.fallo { border-left-color: var(--rojo); }
</style>
</head>
<body>
<main>
  <h1>Test chico</h1>
  <p class="lead">Verifica que el entorno carga y que login funciona. Si esto pasa, el problema es solo del test grande.</p>

  <section id="login">
    <div id="botones-usuario">
      <button type="button" class="btn-usuario" data-email="luciviteri@elisekai.com">Luci</button>
      <button type="button" class="btn-usuario" data-email="yayoqs@elisekai.com">Yayo</button>
    </div>
    <input type="password" id="password" placeholder="contraseña" autocomplete="current-password">
    <button type="button" class="accion" id="btn-entrar">Iniciar sesión y correr</button>
    <p id="estado"></p>
  </section>

  <section id="tests" hidden>
    <div id="resultados"></div>
    <div id="resumen"></div>
  </section>
</main>

<script src="./externos/appwrite.min.js"></script>

<script type="module">
import { CONFIG, validarConfig } from './js/config/config.js';
import { iniciarSesion, cargarSesion, obtenerUsuarioActual } from './js/datos/sesion.js';
import { Resultado } from './js/dominio/resultado.js';
import { establecer, obtener, reiniciar } from './js/nucleo/almacen.js';
import { generarId, escaparHtml } from './js/nucleo/utils.js';

const cont = document.getElementById('resultados');
const resumen = document.getElementById('resumen');
const estadoLogin = document.getElementById('estado');

let pasaron = 0;
let fallaron = 0;

function actualizarResumen() {
  resumen.textContent = `${pasaron} pasaron, ${fallaron} fallaron`;
  resumen.className = fallaron === 0 && pasaron > 0 ? 'ok' : 'fallo';
}

function caso(nombre, fn) {
  const div = document.createElement('div');
  div.className = 'caso';
  cont.append(div);
  try {
    fn();
    div.classList.add('ok');
    div.innerHTML = `<span class="simbolo">✓</span><span>${nombre}</span>`;
    pasaron++;
  } catch (e) {
    div.classList.add('fallo');
    div.innerHTML = `<span class="simbolo">✗</span><span>${nombre}<div class="detalle">${e.message || e}</div></span>`;
    fallaron++;
  }
  actualizarResumen();
}

function exigir(cond, msg) {
  if (!cond) throw new Error(msg);
}

let emailSeleccionado = '';

document.querySelectorAll('.btn-usuario').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.btn-usuario').forEach((b) => b.setAttribute('aria-pressed', 'false'));
    btn.setAttribute('aria-pressed', 'true');
    emailSeleccionado = btn.dataset.email;
    document.getElementById('password').focus();
  });
});

async function correr() {
  pasaron = 0;
  fallaron = 0;
  cont.replaceChildren();

  caso('window.Appwrite existe', () => {
    exigir(window.Appwrite, 'no existe');
  });

  caso('window.Appwrite.Client existe', () => {
    exigir(typeof window.Appwrite.Client === 'function', 'no es función');
  });

  caso('window.Appwrite.TablesDB existe', () => {
    exigir(typeof window.Appwrite.TablesDB === 'function', 'no es función');
  });

  caso('config válida', () => {
    validarConfig();
  });

  caso('config tiene usuarios', () => {
    exigir(CONFIG.usuarios.yayo, 'falta yayo');
    exigir(CONFIG.usuarios.luci, 'falta luci');
  });

  caso('Resultado.ok', () => {
    const r = Resultado.ok({ x: 1 });
    exigir(r.exito && r.datos.x === 1, 'no funciona');
  });

  caso('Resultado.fallo', () => {
    const r = Resultado.fallo('boom');
    exigir(!r.exito && r.error === 'boom', 'no funciona');
  });

  caso('generarId con prefijo', () => {
    const id = generarId('prueba');
    exigir(id.startsWith('prueba_'), 'sin prefijo');
  });

  caso('almacén básico', () => {
    reiniciar();
    establecer('testClave', 42);
    exigir(obtener('testClave') === 42, 'no guardó');
    reiniciar();
  });

  caso('escaparHtml', () => {
    // Uso <\/script> para que el parser de HTML no corte el bloque.
    const s = escaparHtml('<\/script>');
    exigir(!s.includes('<\/script>'), 'no escapó');
  });

  caso('usuario disponible tras login', () => {
    const u = obtenerUsuarioActual();
    exigir(u && u.$id, 'sin usuario');
  });

  actualizarResumen();
}

async function entrarYCorrer() {
  estadoLogin.textContent = 'Iniciando sesión…';
  estadoLogin.style.color = '';
  try {
    const password = document.getElementById('password').value;
    if (!emailSeleccionado) {
      estadoLogin.textContent = 'Primero elige un usuario.';
      estadoLogin.style.color = '#A03737';
      return;
    }
    if (!password) {
      estadoLogin.textContent = 'Escribe la contraseña.';
      estadoLogin.style.color = '#A03737';
      return;
    }
    await iniciarSesion(emailSeleccionado, password);
    estadoLogin.textContent = '';
    document.getElementById('login').hidden = true;
    document.getElementById('tests').hidden = false;
    await correr();
  } catch (e) {
    estadoLogin.textContent = 'Error: ' + e.message;
    estadoLogin.style.color = '#A03737';
  }
}

document.getElementById('btn-entrar').addEventListener('click', entrarYCorrer);
document.getElementById('password').addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter') entrarYCorrer();
});

/* ---------- Detección de sesión activa ---------- */

(async () => {
  try {
    const usuario = await cargarSesion();
    if (usuario) {
      // Ya hay sesión. Saltamos el login y corremos directo.
      document.getElementById('login').hidden = true;
      document.getElementById('tests').hidden = false;
      await correr();
    }
    // Si no hay usuario, se queda mostrando el login.
  } catch (e) {
    // Silencioso: si falla, se muestra el login normal.
  }
})();
</script>
</body>
</html>
