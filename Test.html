  Ahora Sí — Test unificado
  Archivo: Test.html (raíz)
  Versión: 2.0.3
  Propósito: batería completa del núcleo, configuración, sesión,
             repositorios, vistas, audio, realtime, eventos e
             idempotencia.
  v2.0.3: corrige bug de contexto. La suite B llama a
          reiniciarAlmacen(), que borraba usuarioActual y espacio
          del almacén. Eso dejaba sin contexto a todas las suites
          siguientes. Ahora se guarda el contexto al prepararlo y
          se restaura después de la suite B.
  v2.0.2: corrige colisión de nombres. El import "ejecutar" de
          bus-comandos.js chocaba con la función local
          "ejecutar(usuario)". Se renombra el import a
          "ejecutarComando".
  v2.0.1: corrige bug del parser de HTML (</script> literal).
          Se agrega detección de sesión activa al cargar.
  v2.0.0: reescritura completa.
  v1.1.0: agrega suite L. Idempotencia.
  v1.0.0: versión inicial.
-->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahora Sí — Test unificado</title>
<style>
  :root {
    --papel: #F7F1E8;
    --papel-2: #EFE7DA;
    --papel-3: #FCF8F0;
    --borde: #E2D7C5;
    --borde-fuerte: #D2C4AC;
    --tinta: #1F1B16;
    --tinta-suave: #6B6155;
    --tinta-tenue: #A89B87;
    --terracota: #C9613B;
    --musgo: #5A6B3E;
    --rojo: #A03737;
    --ok: #4A7C4A;
    --fuente-titulo: 'Bricolage Grotesque', system-ui, sans-serif;
    --fuente-cuerpo: 'Figtree', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--papel);
    color: var(--tinta);
    font: 400 15px/1.6 var(--fuente-cuerpo);
    padding: 20px 16px 60px;

  }
  main { max-width: 760px; margin: 0 auto; }
  h1 {
    font-family: var(--fuente-titulo);
    font-size: 26px;
    margin: 0 0 4px;
    color: var(--terracota);
    letter-spacing: -.02em;
  }
  .lead { color: var(--tinta-suave); margin: 0 0 20px; font-size: 14px; }

  #login {
    max-width: 420px;
    margin: 40px auto;
    padding: 24px;
    background: var(--papel-2);
    border: 1px solid var(--borde);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #botones-usuario { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-usuario {
    padding: 10px 22px;
    border: 1.5px solid var(--terracota);
    background: transparent;
    color: var(--terracota);
    border-radius: 999px;
    cursor: pointer;
    font-weight: 600;
    font-size: 15px;
  }
  .btn-usuario[aria-pressed="true"] { background: var(--terracota); color: var(--papel); }
  input {
    padding: 11px 14px;
    font: inherit;
    border-radius: 10px;
    border: 1.5px solid var(--borde);
    background: var(--papel-3);
    color: var(--tinta);
    font-size: 15px;
    width: 100%;
  }
  input:focus { outline: 3px solid var(--musgo); outline-offset: 2px; }
  button[type="submit"], #btn-entrar {
    padding: 12px 18px;
    font: inherit;
    border: 0;
    border-radius: 10px;
    background: var(--terracota);
    color: var(--papel);
    font-weight: 600;
    cursor: pointer;
    font-size: 15px;
  }
  #login-estado { min-height: 1.4em; font-size: 13px; color: var(--tinta-suave); margin: 4px 0 0; }

  .suite {
    color: var(--terracota);
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .05em;
    margin: 24px 0 6px;
    border-bottom: 1px solid color-mix(in oklab, var(--terracota) 30%, var(--borde));
    padding-bottom: 4px;
  }
  .caso {
    padding: 8px 12px;
    margin: 4px 0;
    border-radius: 6px;
    background: var(--papel-2);
    border-left: 3px solid transparent;
    font-size: 14px;

    align-items: flex-start;

  }
  .caso.ok { border-left-color: var(--ok); }
  .caso.fallo { border-left-color: var(--rojo); }
  .caso.corriendo { border-left-color: var(--musgo); }
  .caso .simbolo { font-weight: 700; flex-shrink: 0; }
  .caso.ok .simbolo { color: var(--ok); }
  .caso.fallo .simbolo { color: var(--rojo); }

  #resumen {
    margin-top: 24px;
    padding: 16px;
    background: var(--papel-2);
    border-radius: 10px;
    font-weight: 600;
    font-size: 15px;
    border-left: 4px solid var(--terracota);
  }
  #resumen.ok { border-left-color: var(--ok); }
  #resumen.fallo { border-left-color: var(--rojo); }

  #rerun {
    margin-top: 16px;
    padding: 10px 20px;
    font: inherit;
    border: 1.5px solid var(--terracota);
    background: transparent;
    color: var(--terracota);
    border-radius: 999px;
    cursor: pointer;
    font-weight: 600;
  }
  #rerun:hover { background: var(--terracota); color: var(--papel); }
</style>

<link rel="stylesheet" href="./externos/leaflet/leaflet.css">

<body>
<main>

  <section id="login">

<script src="./externos/appwrite.min.js"></script>

<script type="module">
/* ================================================================
   Ahora Sí — TEST UNIFICADO
   ================================================================ */

import { CONFIG, validarConfig } from './js/config/config.js';
import {
  iniciarSesion, cerrarSesion, cargarSesion, obtenerUsuarioActual,
} from './js/datos/sesion.js';
import {
  obtener, establecer, suscribir, reiniciar as reiniciarAlmacen,
} from './js/nucleo/almacen.js';
import { crearLogger } from './js/nucleo/logger.js';
import {
  generarId, formatearFecha, escaparHtml, vacio, debounce,
} from './js/nucleo/utils.js';
import { Resultado } from './js/dominio/resultado.js';
import {
  generarClave, conIdempotencia,
  limpiar as limpiarIdempotencia,
  tamanio as tamanioIdempotencia,
} from './js/nucleo/idempotencia.js';
import { al, emitir, suscriptoresDe } from './js/nucleo/bus-eventos.js';
import {
  registrar,
  ejecutar as ejecutarComando,
  existe,
  desregistrar,
} from './js/nucleo/bus-comandos.js';
import { datosDeAutor, etiquetaAutor } from './js/nucleo/autores.js';

import * as repoPlanes from './js/datos/repositorios/planes.js';
import * as repoKit from './js/datos/repositorios/kit.js';
import * as repoHitos from './js/datos/repositorios/hitos.js';
import * as repoCarta from './js/datos/repositorios/carta.js';
import * as repoRespuestas from './js/datos/repositorios/respuestas.js';
import * as repoFauna from './js/datos/repositorios/fauna.js';
import * as repoFlora from './js/datos/repositorios/flora.js';
import * as repoRitmos from './js/datos/repositorios/ritmos.js';
import * as repoEspacios from './js/datos/repositorios/espacios.js';
import * as repoLugares from './js/datos/repositorios/lugares.js';
import * as repoSeries from './js/datos/repositorios/series.js';
import * as repoRecetas from './js/datos/repositorios/recetas.js';
import * as repoRetos from './js/datos/repositorios/retos.js';
import * as repoPenitencias from './js/datos/repositorios/penitencias.js';
import * as repoPreguntas from './js/datos/repositorios/preguntas.js';
import * as repoApuestas from './js/datos/repositorios/apuestas.js';
import * as repoChistes from './js/datos/repositorios/chistes.js';
import * as repoFotos from './js/datos/repositorios/fotos.js';
import * as repoPerfiles from './js/datos/repositorios/perfiles.js';

import * as vistaCarta from './js/vistas/carta.js';
import * as vistaPlanes from './js/vistas/planes.js';
import * as vistaIdeas from './js/vistas/ideas.js';
import * as vistaHitos from './js/vistas/hitos.js';
import * as vistaKit from './js/vistas/kit.js';
import * as vistaFauna from './js/vistas/fauna.js';
import * as vistaFlora from './js/vistas/flora.js';
import * as vistaMapa from './js/vistas/mapa.js';
import * as vistaSeries from './js/vistas/series.js';
import * as vistaJuegos from './js/vistas/juegos.js';
import * as vistaRecetas from './js/vistas/recetas.js';
import * as vistaPercusion from './js/vistas/percusion.js';
import * as vistaRespuesta from './js/vistas/respuesta.js';
import * as vistaCuenta from './js/vistas/cuenta.js';
import * as vistaHero from './js/vistas/hero.js';

import * as audioBeatmaker from './js/audio/beatmaker.js';
import * as audioSintetizador from './js/audio/sintetizador.js';

import * as realtime from './js/datos/realtime.js';

const log = crearLogger('test:unificado');

const cont = document.getElementById('resultados');
const resumen = document.getElementById('resumen');
const estadoLogin = document.getElementById('login-estado');
const sectionTests = document.getElementById('tests');
const btnRerun = document.getElementById('rerun');

let pasaron = 0;
let fallaron = 0;

/* Contexto guardado. Lo usa restaurarContexto() después de las
   suites que borran el almacén (la suite B llama reiniciar). */
let contextoGuardado = null;

const creados = {
  planes: [], kit: [], hitos: [], carta: [], respuestas: [],
  fauna: [], flora: [], ritmos: [], lugares: [], series: [],
  recetas: [], retos: [], penitencias: [], preguntas: [],
  apuestas: [], chistes: [],
};

const marca = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esperar = (ms) => new Promise((r) => setTimeout(r, ms));

/* ================================================================
   INFRAESTRUCTURA
   ================================================================ */

function actualizarResumen() {
  resumen.textContent = `${pasaron} pasaron, ${fallaron} fallaron`;
  resumen.className = fallaron === 0 && pasaron > 0 ? 'ok' : (pasaron > 0 ? 'fallo' : '');
}

function suite(nombre) {
  const div = document.createElement('div');
  div.className = 'suite';
  div.textContent = nombre;
  cont.append(div);
}

function caso(nombre, fn) {
  const div = document.createElement('div');
  div.className = 'caso corriendo';
  div.innerHTML = `<span class="simbolo">…</span><span>${nombre}</span>`;
  cont.append(div);
  div.scrollIntoView({ block: 'nearest' });

  const exito = () => {
    div.className = 'caso ok';
    div.innerHTML = `<span class="simbolo">✓</span><span>${nombre}</span>`;
    pasaron++;
    actualizarResumen();
  };

  const fallo = (e) => {
    div.className = 'caso fallo';
    div.innerHTML = `<span class="simbolo">✗</span><span>${nombre}<div class="detalle">${e.message || e}</div></span>`;
    fallaron++;
    actualizarResumen();
  };

  try {
    const r = fn();
    if (r instanceof Promise) return r.then(exito).catch(fallo);
    exito();
  } catch (e) {
    fallo(e);
  }
}

function exigir(cond, msg) {
  if (!cond) throw new Error(msg);
}

async function limpiarTodo() {
  const mapa = {
    planes: repoPlanes, kit: repoKit, hitos: repoHitos,
    carta: repoCarta, fauna: repoFauna, flora: repoFlora,
    ritmos: repoRitmos, lugares: repoLugares, series: repoSeries,
    recetas: repoRecetas, retos: repoRetos, penitencias: repoPenitencias,
    preguntas: repoPreguntas, apuestas: repoApuestas, chistes: repoChistes,
  };
  for (const [clave, ids] of Object.entries(creados)) {
    const repo = mapa[clave];
    if (!repo) continue;
    for (const id of ids) {
      try { await repo.eliminar(id); } catch (e) { log.warn('Limpieza falló:', clave, id); }
    }
    creados[clave] = [];
  }
}

async function prepararContexto(usuario) {
  await limpiarTodo();

  const r = await repoEspacios.crear({
    nombre: 'Espacio test ' + marca(),
    miembros: [usuario.$id],
  });
  exigir(r.exito, 'No se pudo crear el espacio de prueba: ' + r.error);
  const espacioPrueba = r.datos;

  // Guardo el contexto para poder restaurarlo si alguna suite
  // borra el almacén (como hace la suite B con reiniciar).
  contextoGuardado = { usuario, espacio: espacioPrueba };

  establecer('usuarioActual', usuario);
  establecer('espacio', espacioPrueba);
  return espacioPrueba;
}

function restaurarContexto() {
  if (!contextoGuardado) return;
  establecer('usuarioActual', contextoGuardado.usuario);
  establecer('espacio', contextoGuardado.espacio);
}

/* ================================================================
   SUITES
   ================================================================ */

async function suiteSanidad() {
  suite('A. Sanidad del núcleo');

  await caso('bundle UMD de Appwrite cargado', () => {
    exigir(window.Appwrite, 'window.Appwrite no existe');
    exigir(typeof window.Appwrite.Client === 'function', 'Client no disponible');
  });

  await caso('Channel disponible', () => {
    exigir(typeof window.Appwrite.Channel === 'function', 'Channel no está en el bundle');
  });

  await caso('TablesDB disponible', () => {
    exigir(typeof window.Appwrite.TablesDB === 'function', 'TablesDB no está en el bundle');
  });

  await caso('Storage disponible', () => {
    exigir(typeof window.Appwrite.Storage === 'function', 'Storage no está en el bundle');
  });

  await caso('Leaflet cargado', () => {
    exigir(window.L, 'window.L no existe');
    exigir(typeof window.L.map === 'function', 'L.map no disponible');
  });

  await caso('config válida', () => {
    exigir(validarConfig(), 'validarConfig falló');
  });

  await caso('config tiene usuarios yayo y luci', () => {
    exigir(CONFIG.usuarios.yayo, 'falta yayo');
    exigir(CONFIG.usuarios.luci, 'falta luci');
  });
}

async function suiteAlmacen() {
  suite('B. Núcleo: almacén');

  await caso('establecer y obtener', () => {
    establecer('testClave', { a: 1 });
    const v = obtener('testClave');
    exigir(v?.a === 1, 'no devolvió el valor');
  });

  await caso('suscribir recibe notificación', async () => {
    let recibido = null;
    const desuscribir = suscribir(({ clave, valor }) => {
      if (clave === 'testSuscripcion') recibido = valor;
    });
    establecer('testSuscripcion', 42);
    await esperar(20);
    desuscribir();
    exigir(recibido === 42, 'no llegó la notificación');
  });

  await caso('reiniciar limpia el estado', () => {
    // Uso una clave que NO pisa el contexto. Después de reiniciar,
    // restauro el contexto para las suites siguientes.
    establecer('testReinicio', { x: 1 });
    reiniciarAlmacen();
    exigir(obtener('testReinicio') === null, 'no se limpió');
    // Restaurar el contexto para las suites siguientes.
    restaurarContexto();
  });
}

async function suiteResultado() {
  suite('C. Núcleo: Resultado');

  await caso('Resultado.ok', () => {
    const r = Resultado.ok({ x: 1 });
    exigir(r.exito === true, 'exito debería ser true');
    exigir(r.datos.x === 1, 'datos incorrectos');
    exigir(r.error === null, 'error debería ser null');
  });

  await caso('Resultado.fallo', () => {
    const r = Resultado.fallo('boom');
    exigir(r.exito === false, 'exito debería ser false');
    exigir(r.error === 'boom', 'error incorrecto');
  });

  await caso('encadenar en éxito', () => {
    const r = Resultado.ok(2).encadenar((v) => Resultado.ok(v * 3));
    exigir(r.exito && r.datos === 6, 'encadenar falló');
  });

  await caso('encadenar en fallo se propaga', () => {
    const r = Resultado.fallo('boom').encadenar(() => Resultado.ok(1));
    exigir(!r.exito && r.error === 'boom', 'debería propagar el fallo');
  });

  await caso('recuperar transforma fallo en ok', () => {
    const r = Resultado.fallo('boom').recuperar(() => Resultado.ok('salvado'));
    exigir(r.exito && r.datos === 'salvado', 'recuperar falló');
  });
}

async function suiteUtilidades() {
  suite('D. Núcleo: utilidades');

  await caso('generarId usa prefijo', () => {
    const id = generarId('prueba');
    exigir(id.startsWith('prueba_'), 'no usa el prefijo');
    exigir(id.length > 10, 'id demasiado corto');
  });

  await caso('formatearFecha con ISO', () => {
    const s = formatearFecha('2026-09-25T12:00:00Z');
    exigir(typeof s === 'string' && s.length > 0, 'no formatea');
  });

  await caso('formatearFecha con fecha inválida devuelve vacío', () => {
    const s = formatearFecha('no-es-fecha');
    exigir(s === '', 'debería ser vacío');
  });

  await caso('escaparHtml', () => {
    // Uso <\/script> para que el parser de HTML no corte el bloque.
    const s = escaparHtml('<\/script>');
    exigir(!s.includes('<\/script>'), 'no escapó');
    exigir(s.includes('&lt;'), 'no usó entidades');
  });

  await caso('vacio reconoce null, undefined y string vacío', () => {
    exigir(vacio(null), 'null no es vacío');
    exigir(vacio(undefined), 'undefined no es vacío');
    exigir(vacio(''), 'string vacío no es vacío');
    exigir(!vacio('x'), 'string con contenido sí es vacío');
    exigir(!vacio(0), 'cero sí es vacío');
  });

  await caso('debounce ejecuta una sola vez', async () => {
    let contador = 0;
    const fn = debounce(() => { contador++; }, 40);
    fn(); fn(); fn();
    await esperar(120);
    exigir(contador === 1, 'debounce debería ejecutar una vez');
  });
}

async function suiteIdempotenciaNucleo() {
  suite('E. Núcleo: idempotencia');

  await caso('generarClave es determinista', () => {
    const k1 = generarClave('u1', 'op', { a: 1 });
    const k2 = generarClave('u1', 'op', { a: 1 });
    const k3 = generarClave('u1', 'op', { a: 2 });
    exigir(k1 === k2, 'misma entrada dio distinta clave');
    exigir(k1 !== k3, 'entrada distinta dio misma clave');
  });

  await caso('conIdempotencia cachea éxito', async () => {
    limpiarIdempotencia();
    const clave = 'test-' + marca();
    let contador = 0;
    await conIdempotencia(clave, async () => { contador++; return Resultado.ok({ x: 1 }); });
    await conIdempotencia(clave, async () => { contador++; return Resultado.ok({ x: 1 }); });
    exigir(contador === 1, 'debería ejecutar una sola vez');
  });

  await caso('conIdempotencia libera clave tras fallo', async () => {
    limpiarIdempotencia();
    const clave = 'test-fallo-' + marca();
    let contador = 0;
    await conIdempotencia(clave, async () => { contador++; return Resultado.fallo('boom'); }, (r) => r.exito);
    await conIdempotencia(clave, async () => { contador++; return Resultado.ok({}); });
    exigir(contador === 2, 'debería ejecutar dos veces');
  });

  await caso('limpiar deja el registro en cero', () => {
    limpiarIdempotencia();
    exigir(tamanioIdempotencia() === 0, 'no se limpió');
  });
}

async function suiteBusEventos() {
  suite('F. Núcleo: bus de eventos');

  await caso('al y emitir', () => {
    let recibido = null;
    const desuscribir = al('test:evento', (d) => { recibido = d; });
    emitir('test:evento', { x: 5 });
    desuscribir();
    exigir(recibido?.x === 5, 'no llegó el payload');
  });

  await caso('desuscribir detiene la recepción', () => {
    let contador = 0;
    const desuscribir = al('test:evento2', () => { contador++; });
    desuscribir();
    emitir('test:evento2', {});
    exigir(contador === 0, 'siguió recibiendo tras desuscribir');
  });

  await caso('suscriptoresDe cuenta suscriptores', () => {
    const d1 = al('test:evento3', () => {});
    const d2 = al('test:evento3', () => {});
    exigir(suscriptoresDe('test:evento3') === 2, 'no cuenta bien');
    d1(); d2();
    exigir(suscriptoresDe('test:evento3') === 0, 'no limpió bien');
  });
}

async function suiteBusComandos() {
  suite('G. Núcleo: bus de comandos');

  await caso('registrar y ejecutarComando', () => {
    registrar('test:comando', (a, b) => a + b);
    exigir(ejecutarComando('test:comando', 2, 3) === 5, 'no ejecutó');
  });

  await caso('existe detecta el comando', () => {
    exigir(existe('test:comando'), 'debería existir');
    exigir(!existe('test:no-existe-' + marca()), 'no debería existir');
  });

  await caso('desregistrar lo elimina', () => {
    desregistrar('test:comando');
    exigir(!existe('test:comando'), 'no se desregistró');
  });
}

async function suiteAutores() {
  suite('H. Núcleo: autores');

  await caso('etiquetaAutor con usuario conocido', () => {
    const etiqueta = etiquetaAutor(CONFIG.usuarios.yayo);

async function suiteIdempotenciaRepo() {
  suite('AF. Idempotencia en repositorios');

  let planIdIdem = null;

  await caso('crear dos veces con los mismos datos no duplica', async () => {
    const datos = { titulo: 'Idem ' + marca(), descripcion: 'test' };
    const r1 = await repoPlanes.crear(datos);
    exigir(r1.exito, r1.error);
    planIdIdem = r1.datos.id;
    creados.planes.push(planIdIdem);

    const r2 = await repoPlanes.crear(datos);
    exigir(r2.exito, r2.error);
    exigir(r2.datos.id === planIdIdem, `Se duplicó: ${r1.datos.id} vs ${r2.datos.id}`);

    const listado = await repoPlanes.listar();
    exigir(listado.exito, listado.error);
    const coincidencias = listado.datos.filter((p) => p.titulo === datos.titulo);
    exigir(coincidencias.length === 1, `Se encontraron ${coincidencias.length} filas`);
  });

  await caso('crear con datos distintos sí crea dos filas', async () => {
    const r1 = await repoPlanes.crear({ titulo: 'A ' + marca() });
    exigir(r1.exito, r1.error);
    creados.planes.push(r1.datos.id);

    const r2 = await repoPlanes.crear({ titulo: 'B ' + marca() });
    exigir(r2.exito, r2.error);
    creados.planes.push(r2.datos.id);

    exigir(r1.datos.id !== r2.datos.id, 'Dos títulos distintos dieron el mismo id');
  });

  await caso('clave explícita fuerza la reutilización', async () => {
    const clave = 'test-explicito-' + marca();
    const datos = { titulo: 'X ' + marca() };
    const r1 = await repoPlanes.crear(datos, { idOperacion: clave });
    exigir(r1.exito, r1.error);
    creados.planes.push(r1.datos.id);

    const r2 = await repoPlanes.crear({ titulo: 'Y ' + marca() }, { idOperacion: clave });
    exigir(r2.exito, r2.error);
    exigir(r2.datos.id === r1.datos.id, 'Con la misma clave debería devolver la misma fila');
  });

  await caso('eliminar el plan de la suite', async () => {
    const r = await repoPlanes.eliminar(planIdIdem);
    exigir(r.exito, r.error);
    creados.planes = creados.planes.filter((x) => x !== planIdIdem);
    planIdIdem = null;
  });
}

  suite('AG. Limpieza final');
  await caso('eliminar espacio de prueba', async () => {
    exigir(espacioPrueba, 'sin espacio de prueba');
    await limpiarTodo();
    const r = await repoEspacios.eliminar(espacioPrueba.id);
    exigir(r.exito, r.error);
  });

  actualizarResumen();
  btnRerun.hidden = false;
}

/* ================================================================
   LOGIN
   ================================================================ */

let emailSeleccionado = '';

document.querySelectorAll('.btn-usuario').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.btn-usuario').forEach((b) => b.setAttribute('aria-pressed', 'false'));
    btn.setAttribute('aria-pressed', 'true');
    emailSeleccionado = btn.dataset.email;
    document.getElementById('password').focus();
  });
});

async function entrarYCorrer() {
  estadoLogin.textContent = 'Iniciando sesión…';
  estadoLogin.style.color = '';
  try {
    const password = document.getElementById('password').value;
    if (!emailSeleccionado) {
      estadoLogin.textContent = 'Primero elige un usuario.';
      estadoLogin.style.color = '#A03737';
      return;
    }
    if (!password) {
      estadoLogin.textContent = 'Escribe la contraseña.';
      estadoLogin.style.color = '#A03737';
      return;
    }
    await iniciarSesion(emailSeleccionado, password);
    const usuario = obtenerUsuarioActual();
    if (!usuario) throw new Error('Sin usuario tras login');
    estadoLogin.textContent = '';
    document.getElementById('login').hidden = true;
    sectionTests.hidden = false;
    await ejecutar(usuario);
  } catch (e) {
    log.error('Error en login:', e.message);
    estadoLogin.textContent = 'Error: ' + e.message;
    estadoLogin.style.color = '#A03737';
  }
}

document.getElementById('btn-entrar').addEventListener('click', entrarYCorrer);
document.getElementById('password').addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter') entrarYCorrer();
});

btnRerun.addEventListener('click', () => {
  // Recarga sin cerrar sesión.
  location.reload();
});

/* ================================================================
   ARRANQUE: detectar sesión existente
   ================================================================ */

(async () => {
  try {
    const usuario = await cargarSesion();
    if (usuario) {
      // Ya hay sesión. Saltamos el login y corremos directo.
      document.getElementById('login').hidden = true;
      sectionTests.hidden = false;
      await ejecutar(usuario);
    }
    // Si no hay usuario, se queda mostrando el login.
  } catch (e) {
    // Silencioso: si falla, se muestra el login normal.
  }
})();
</script>
