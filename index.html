<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahora Sí</title>
<meta name="theme-color" content="#0C2F26">
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="externos/leaflet/leaflet.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/componentes.css">
<link rel="stylesheet" href="css/vistas/hero.css">
<link rel="stylesheet" href="css/vistas/carta.css">
<link rel="stylesheet" href="css/vistas/planes.css">
<link rel="stylesheet" href="css/vistas/ideas.css">
<link rel="stylesheet" href="css/vistas/hitos.css">
<link rel="stylesheet" href="css/vistas/kit.css">
<link rel="stylesheet" href="css/vistas/fauna.css">
<link rel="stylesheet" href="css/vistas/flora.css">
<link rel="stylesheet" href="css/vistas/mapa.css">
<link rel="stylesheet" href="css/vistas/series.css">
<link rel="stylesheet" href="css/vistas/juegos.css">
<link rel="stylesheet" href="css/vistas/percusion.css">
<link rel="stylesheet" href="css/vistas/respuesta.css">
<link rel="stylesheet" href="css/vistas/cuenta.css">

<!-- SDK de Appwrite (UMD local v25) -->
<script src="externos/appwrite.min.js" defer></script>
<!-- Leaflet (v1.9.4, local). Se carga antes que app.js para que
     window.L esté disponible cuando la vista Mapa se monte. -->
<script src="externos/leaflet/leaflet.js" defer></script>
</head>
<body>
<div id="app">
  <div id="cargando">Cargando…</div>
</div>

<div id="captura-error"></div>

<script>
(function () {
  'use strict';
  const captura = document.getElementById('captura-error');
  const lineas = [];

  function mostrar() {
    captura.style.display = 'block';
    captura.innerHTML = '<strong>Error detectado al cargar la app</strong>' + lineas.join('\n');
  }

  function registrar(origen, mensaje, extra) {
    const linea = `[${origen}] ${mensaje}` + (extra ? `\n  ${extra}` : '');
    lineas.push(linea);
    console.error(origen, mensaje, extra || '');
    mostrar();
  }

  function esLocal(url) {
    if (!url) return false;
    try {
      const u = new URL(url, location.href);
      return u.origin === location.origin;
    } catch (e) {
      return false;
    }
  }

  window.addEventListener('error', (ev) => {
    if (ev.target && ev.target.tagName === 'SCRIPT') {
      if (!esLocal(ev.target.src)) return;
      registrar('script', `No se pudo cargar: ${ev.target.src}`);
      return;
    }
    if (ev.target && ev.target.tagName === 'LINK') {
      if (!esLocal(ev.target.href)) return;
      registrar('css', `No se pudo cargar: ${ev.target.href}`);
      return;
    }
    registrar('error', ev.message || 'Error desconocido', ev.filename ? `${ev.filename}:${ev.lineno}:${ev.colno}` : '');
  }, true);

  window.addEventListener('unhandledrejection', (ev) => {
    const razon = ev.reason;
    const msg = razon?.message || String(razon) || 'Promesa rechazada sin motivo';
    const stack = razon?.stack ? razon.stack.split('\n').slice(0, 6).join('\n  ') : '';
    registrar('promesa', msg, stack);
  });

  setTimeout(() => {
    const c = document.getElementById('cargando');
    if (c && c.parentNode) {
      console.warn('[timeout] La app tardó más de 15 segundos en quitar el "Cargando…".');
    }
  }, 15000);
})();
</script>

<script type="module" src="js/app.js"></script>
</body>
</html>
