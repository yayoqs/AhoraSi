<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beatmaker v2 — Optimizado</title>
<style>
:root{color-scheme:dark;--bg:#0C2F26;--bg2:#123F34;--bg3:#0e3529;--paper:#EEF2E8;--ink:#0A1F1A;--gold:#E3BC55;--sky:#8DB7D8;--dim:#A9C2B6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--paper);font:400 15px/1.5 system-ui,-apple-system,sans-serif;padding:16px 14px 60px}
main{max-width:720px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
h1{margin:0;font:700 20px/1.1 'Trebuchet MS',system-ui,sans-serif;color:var(--gold);letter-spacing:-.02em}
.top p{margin:2px 0 0;font-size:12px;color:var(--dim)}
#dot{width:16px;height:16px;border-radius:50%;background:var(--gold);opacity:.35;transition:transform .12s,opacity .12s;flex:none}
#dot.on{opacity:1;transform:scale(1.5);box-shadow:0 0 14px var(--gold)}
.grupo{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sky);margin:10px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;border:1.5px solid rgba(238,242,232,.3);background:transparent;color:var(--paper);font:600 13px system-ui;cursor:pointer}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.info{margin:12px 0;padding:10px 14px;background:var(--bg2);border-left:3px solid var(--sky);border-radius:6px;color:var(--dim);font-size:13px}
.info b{color:var(--sky)}
#grid{background:var(--bg3);border-radius:12px;padding:10px 10px 4px;margin-bottom:14px}
.voz{margin-bottom:12px}
.voz>label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}
.pasos{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.c{height:34px;border-radius:6px;border:1.5px solid rgba(238,242,232,.16);background:transparent;color:var(--ink);font:700 12px system-ui;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.c.b{border-color:rgba(238,242,232,.38)}
.c.cur{box-shadow:0 0 0 2px var(--sky) inset;border-color:var(--sky)}
.ctl{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.play{padding:12px 30px;border:0;border-radius:999px;background:var(--gold);color:var(--ink);font:700 15px system-ui;cursor:pointer}
.sl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.sl b{color:var(--paper);min-width:56px;font-variant-numeric:tabular-nums}
input[type=range]{accent-color:var(--gold);width:110px}
.btn{padding:9px 16px;border-radius:999px;border:1.5px solid rgba(238,242,232,.35);background:transparent;color:var(--paper);font:500 13px system-ui;cursor:pointer}
.btn[aria-pressed=true]{background:var(--sky);border-color:var(--sky);color:var(--ink)}
.panel{background:var(--bg2);border-left:3px solid var(--sky);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.panel[hidden]{display:none}
.pf{display:grid;grid-template-columns:100px 1fr 68px;gap:10px;align-items:center;padding:3px 0;font-size:13px}
.pf input{width:100%}
.mb{border:1px solid rgba(238,242,232,.25);background:transparent;color:var(--dim);font-size:11px;padding:4px 8px;border-radius:6px;margin-left:3px;cursor:pointer}
.mb.on{background:#f87171;border-color:#f87171;color:var(--ink);font-weight:700}
.mb.on.s{background:var(--gold);border-color:var(--gold)}
@media(max-width:400px){input[type=range]{width:90px}.pf{grid-template-columns:82px 1fr 64px}}
</style>
</head>
<body>
<main>
<div class="top"><div id="dot"></div><div><h1>Beatmaker v2 — Ahora Sí</h1><p>16 pasos · 7 voces · 6 bases. Toca una celda para cambiar su fuerza.</p></div></div>
<div class="grupo">Cumbia</div><div class="chips" id="ch-cum"></div>
<div class="grupo">Afro</div><div class="chips" id="ch-afr"></div>
<div class="info" id="info"></div>
<div id="grid"></div>
<div class="ctl">
<button class="play" id="play" type="button">Tocar</button>
<label class="sl">Tempo<input id="bpm" type="range" min="70" max="140"><b id="bpmv"></b></label>
<label class="sl">Swing<input id="sw" type="range" min="0" max="50"><b id="swv"></b></label>
</div>
<div class="ctl">
<button class="btn" id="bm" type="button" aria-pressed="false">Mezcla</button>
<button class="btn" id="bf" type="button" aria-pressed="false">Efectos</button>
<button class="btn" id="reset" type="button">Reset</button>
<button class="btn" id="clear" type="button">Limpiar</button>
</div>
<div class="panel" id="pm" hidden></div>
<div class="panel" id="pfx" hidden></div>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const COL=['#E3BC55','#EBA9A2','#8DB7D8','#9BE0B5','#F2C879','#C4A8EE','#F29E6B'];
const MIN=[0,2,3,5,7,8,10],PEN=[0,3,5,7,10];
const NAMES={cum:['Bombo','Caja','Timbal','Güira','Cencerro','Bajo','Teclas'],afr:['Bombo','Slap djembé','Grave djembé','Shekere','Gankogui','Log bajo','Kalimba']};
const V={'.':0,o:.4,x:.72,X:1};
const VOL0=[1.0, .8, .8, .6, .55, .9, .55];

/* REINGENIERÍA DE PATRONES: Groove real, síncopas correctas y duraciones dinámicas */
const P=[
{id:'vc',g:'cum',n:'Villera Clásica',b:94,sw:5,root:45,sc:MIN,fx:[10,12,35,100],d:'Groove villero auténtico. Bombo 4x4 pesando, güira arrastrando a tierra, bajo saltando en contratiempo.',
r:['X...X...X...X...','....X.......X...','..x...x.x.x.....','X.xxX.xxX.xxX.xx','..X...X...X...X.','..1...5...1...5.','....3.......3...']},
{id:'vd',g:'cum',n:'Villera Dura',b:92,sw:0,root:43,sc:MIN,fx:[10,8,55,100],d:'Saturada y de la calle. Bombo doble insinuado, cencerro agresivo, bajo caminando en tónicas.',
r:['X..xX...X..xX...','....X.......X.xX','x.x.x.x.x.x.x.x.','X.xxx.xxX.xxx.xx','X.X.X.X.X.X.X.X.','1..1..5.1..1..5.','1..1..3.5.......']},
{id:'cb',g:'cum',n:'Cumbia Sonidera',b:90,sw:10,root:38,sc:MIN,fx:[16,10,20,100],d:'Estilo más tropical. Bombo clásico en 1 y 3, timbales con sabor, bajo en Re menor caminando.',
r:['X.......X.......','....x.o.....x.o.','o..x..o...xx..o.','X.x.X.x.X.x.X.x.','....x.......x...','1..1..5.1.....4.','1..3..5.3..5..3.']},
{id:'at',g:'afr',n:'Afro Tumbé',b:110,sw:18,root:40,sc:PEN,fx:[24,24,15,100],d:'Polirritmia pura. Gankogui marcando clave 3-2 cruzado contra el bombo.',
r:['X...o...X..x....','..x...X...x...X.','x..x..o...x..x..','X.x.X.x.X.x.X.x.','X..X..x...X.X...','1.....1...3.5...','1.3.5.3.1.3.5.6.']},
{id:'ab',g:'afr',n:'Afrobeat',b:114,sw:15,root:41,sc:PEN,fx:[20,20,15,100],d:'Groove cerrado. Backbeat firme, percusiones entretejidas y bajo melódico.',
r:['X.......X..x....','....X.......X...','..x...x...x...x.','x.x.x.x.x.x.x.x.','x.x..x.x..x.x...','1..1.3..5..3.1..','5.3.1.3.5.6.5.3.']},
{id:'ah',g:'afr',n:'Afro House',b:122,sw:5,root:43,sc:PEN,fx:[28,26,12,100],d:'Ritmo de club 4x4. Log bajo marcando el sub-grave, reverberación espaciosa.',
r:['X...X...X...X...','....x.......x...','..x..o..x..o..x.','oXoXoXoXoXoXoXoX','..x..x..x..x..x.','1..1..1.1..1..5.','3...5...6...5...']}
];

let K,vel,notes,vol,mute,solo,fx,bpm,sw,playing=false,paso=0,prox=0,timer=null;
let ctx,bus,filt,rsend,dsend,dl,rvg,drv,dry,nbuf;
const mf=m=>440*2**((m-69)/12);
const nota=(d,off)=>{const s=K.sc,i=d-1;return mf(K.root+s[i%s.length]+12*Math.floor(i/s.length)+off)};

/* ---------- audio ---------- */
function audio(){
 if(ctx){ctx.resume();return}
 ctx=new(window.AudioContext||window.webkitAudioContext)();
 bus=ctx.createGain();filt=ctx.createBiquadFilter();filt.type='lowpass';
 const comp=ctx.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=5;comp.attack.value=.002;comp.release.value=.1; // Más "pumping"
 const out=ctx.createGain();out.gain.value=0.9;
 dry=ctx.createGain();drv=ctx.createGain();const sh=ctx.createWaveShaper(),cv=new Float32Array(1024);
 for(let i=0;i<1024;i++)cv[i]=Math.tanh((i/512-1)*5);sh.curve=cv; // Más saturación
 bus.connect(dry);bus.connect(sh);sh.connect(drv);dry.connect(filt);drv.connect(filt);filt.connect(comp);comp.connect(out);out.connect(ctx.destination);
 
 const rv=ctx.createConvolver(),n=ctx.sampleRate*1.5,imp=ctx.createBuffer(2,n,ctx.sampleRate);
 for(let c=0;c<2;c++){const d=imp.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.8)}
 rv.buffer=imp;rsend=ctx.createGain();rvg=ctx.createGain();bus.connect(rsend);rsend.connect(rv);rv.connect(rvg);rvg.connect(comp);
 
 dl=ctx.createDelay(1.5);dsend=ctx.createGain();const fb=ctx.createGain(),lf=ctx.createBiquadFilter();fb.gain.value=.4;lf.type='lowpass';lf.frequency.value=2200;
 bus.connect(dsend);dsend.connect(dl);dl.connect(lf);lf.connect(fb);fb.connect(dl);lf.connect(comp);
 
 nbuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 aplicarFx();
}

function aplicarFx(){
 if(!ctx)return;
 rsend.gain.value=fx.rev/100*.9;dsend.gain.value=fx.del/100*.7;
 drv.gain.value=fx.drv/100*.7;dry.gain.value=1-(fx.drv/250);
 filt.frequency.value=200*Math.pow(100,fx.flt/100);
 dl.delayTime.value=60/bpm*.75;
}

// Helpers de síntesis mejorados (Soportan decay y envolventes más complejas)
function tone(o,t,ty,f0,f1,d,vol,decayCurve='exp'){const s=ctx.createOscillator(),g=ctx.createGain();s.type=ty;s.frequency.setValueAtTime(f0,t);if(f1!==f0)s.frequency.exponentialRampToValueAtTime(f1,t+Math.min(.1,d*.5));g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.002);if(decayCurve==='exp'){g.gain.exponentialRampToValueAtTime(.0001,t+d);}else{g.gain.linearRampToValueAtTime(.0001,t+d);}s.connect(g);g.connect(o);s.start(t);s.stop(t+d+.02)}
function nz(o,t,d,ty,f,q,vol){const s=ctx.createBufferSource(),fl=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=nbuf;fl.type=ty;fl.frequency.value=f;fl.Q.value=q;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.001);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(o);s.start(t,Math.random()*.4);s.stop(t+d+.02)}
const bp=(o,f,q)=>{const b=ctx.createBiquadFilter();b.type='bandpass';b.frequency.value=f;b.Q.value=q;b.connect(o);return b};
const lp=(o,f,q)=>{const b=ctx.createBiquadFilter();b.type='lowpass';b.frequency.value=f;b.Q.value=q||0;b.connect(o);return b};

/* REINGENIERÍA DE SÍNTESIS CUMBIA (SC) */
const SC=[
// 0: Bombo (Ataque ultra rápido de 300Hz a 45Hz = Kick real)
(o,t,v)=>{tone(o,t,'sine',300,45,.35,v*1.2);nz(o,t,.01,'lowpass',1000,0,.15*v)},
// 1: Caja (Añadido cuerpo en 220Hz + Ruido ajustado)
(o,t,v)=>{tone(o,t,'triangle',220,160,.18,.5*v);nz(o,t,.15,'bandpass',3000,1.2,.7*v);nz(o,t,.08,'highpass',5000,.5,.3*v)},
// 2: Timbal (Cuerpo resonante y transiente metálico al ataque)
(o,t,v)=>{tone(o,t,'sine',380,300,.25,.9*v);tone(o,t,'square',800,600,.05,.15*v)},
// 3: Güira (LA CLAVE: Duración del raspado depende de la fuerza del acento)
(o,t,v)=>{const dur = v > 0.8 ? 0.16 : 0.035; nz(o,t,dur,'highpass',5500,0.8,0.7*v);nz(o,t,dur*1.2,'bandpass',8000,1.5,0.3*v)},
// 4: Cencerro (Dos ondas cuadradas disonantes para el tono metálico)
(o,t,v)=>{const b=bp(o,1200,1);tone(b,t,'square',540,540,.2,v);tone(b,t,'square',780,780,.2,v)},
// 5: Bajo (Pluck clásico de sinte: Lowpass que se cierra rápido)
(o,t,v,f)=>{const l=lp(o,1500);l.frequency.setValueAtTime(1500,t);l.frequency.exponentialRampToValueAtTime(120,t+.25);tone(l,t,'sawtooth',f,f,.35,0.7*v);tone(o,t,'sine',f/2,f/2,.35,0.9*v)},
// 6: Teclas (Stab corto con chorus artificial)
(o,t,v,f)=>{const l=lp(o,2200,1);tone(l,t,'sawtooth',f,f,.2,.3*v);tone(l,t,'sawtooth',f*1.01,f*1.01,.2,.3*v);tone(l,t,'square',f*0.5,f*0.5,.2,.2*v)}
];

/* REINGENIERÍA DE SÍNTESIS AFRO (SA) */
const SA=[
// 0: Bombo profundo
(o,t,v)=>{tone(o,t,'sine',150,42,.45,v*1.1);nz(o,t,.01,'highpass',2000,.7,.15*v)},
// 1: Slap Djembé
(o,t,v)=>{nz(o,t,.12,'bandpass',2500,1.2,.8*v);tone(o,t,'triangle',400,280,.1,.4*v)},
// 2: Grave Djembé
(o,t,v)=>{tone(o,t,'sine',160,85,.35,v);nz(o,t,.04,'bandpass',500,1,.2*v)},
// 3: Shekere (Raspado orgánico)
(o,t,v)=>{const dur = v > 0.8 ? 0.12 : 0.04; nz(o,t,dur,'bandpass',6000,.8,0.5*v)},
// 4: Gankogui (Campana africana doble)
(o,t,v)=>{const b=bp(o,2000,1.5);tone(b,t,'triangle',480,480,.4,.8*v);tone(b,t,'triangle',710,710,.3,.6*v)},
// 5: Log Bajo (Madera tonal profunda)
(o,t,v,f)=>{tone(o,t,'sine',f*1.5,f,.4,v);tone(o,t,'triangle',f*3,f*1.5,.08,.3*v)},
// 6: Kalimba (Tono metálico con armónico dominante)
(o,t,v,f)=>{tone(o,t,'sine',f,f,.5,.6*v);tone(o,t,'sine',f*5.2,f*5.2,.1,.2*v);tone(o,t,'triangle',f*2,f*2,.3,.2*v)}
];

function voz(i,t,v,f){
 if(mute[i]||(solo.some(Boolean)&&!solo[i]))return;
 const o=ctx.createGain();o.gain.value=vol[i];o.connect(bus);
 (K.g==='cum'?SC:SA)[i](o,t,v,f);
}
const nf=(i,c)=>i>4?nota(vel[i][c],i===5?0:(K.g==='cum'?12:24)):0;

/* ---------- secuenciador ---------- */
function pump(){
 while(prox<ctx.currentTime+.12){
  const c=paso,dur=60/bpm/4,t=prox+(c%2?sw/100*dur:0);
  for(let i=0;i<7;i++){const v=vel[i][c];if(v)voz(i,t,i>4?.85:v,nf(i,c))}
  setTimeout(()=>{if(playing)marcar(c)},Math.max(0,(t-ctx.currentTime)*1000));
  prox+=dur;paso=(paso+1)%16;
 }
}
function marcar(c){
 document.querySelectorAll('.cur').forEach(n=>n.classList.remove('cur'));
 document.querySelectorAll('.c[data-c="'+c+'"]').forEach(n=>n.classList.add('cur'));
 if(c%4===0){const d=$('dot');d.classList.add('on');setTimeout(()=>d.classList.remove('on'),110)}
}
function togglePlay(){
 audio();playing=!playing;$('play').textContent=playing?'Parar':'Tocar';
 if(playing){paso=0;prox=ctx.currentTime+.05;pump();timer=setInterval(pump,25)}
 else{clearInterval(timer);document.querySelectorAll('.cur').forEach(n=>n.classList.remove('cur'))}
}

/* ---------- UI ---------- */
function pintarCelda(el,r,c){
 const v=vel[r][c],col=COL[r];
 el.style.background=v?col+(r>4?'e0':Math.round(Math.max(.3,v)*255).toString(16).padStart(2,'0')):'';
 el.style.borderColor=v?col:'';
 el.textContent=r>4&&v?v:'';
}
function pintarGrid(){
 const g=$('grid');g.innerHTML='';
 NAMES[K.g].forEach((n,r)=>{
  const w=document.createElement('div');w.className='voz';
  w.innerHTML='<label style="color:'+COL[r]+'">'+n+'</label><div class="pasos"></div>';
  const p=w.lastChild;
  for(let c=0;c<16;c++){
   const b=document.createElement('button');b.type='button';b.className='c'+(c%4===0?' b':'');b.dataset.r=r;b.dataset.c=c;
   b.setAttribute('aria-label',n+', paso '+(c+1));pintarCelda(b,r,c);p.append(b);
  }
  g.append(w);
 });
}
$('grid').addEventListener('click',e=>{
 const b=e.target.closest('.c');if(!b)return;
 const r=+b.dataset.r,c=+b.dataset.c;
 if(r>4){vel[r][c]=(vel[r][c]+1)%(K.sc.length+2)}
 else{const cy=[0,.72,1,.4];vel[r][c]=cy[(cy.indexOf(vel[r][c])+1)%4]}
 pintarCelda(b,r,c);
 if(vel[r][c]){audio();voz(r,ctx.currentTime+.01,r>4?.85:vel[r][c],nf(r,c))}
});
function pintarChips(){
 ['cum','afr'].forEach(g=>{
  const c=$('ch-'+g);c.innerHTML='';
  P.filter(p=>p.g===g).forEach(p=>{
   const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=p.n;
   b.setAttribute('aria-pressed',String(p===K));b.onclick=()=>cargar(p.id);c.append(b);
  });
 });
}
function pintarMezcla(){
 $('pm').innerHTML='<div class="grupo" style="margin-top:0">Volumen por voz</div>'+NAMES[K.g].map((n,i)=>'<div class="pf"><label style="color:'+COL[i]+'">'+n+'</label><input type="range" min="0" max="100" value="'+Math.round(vol[i]*100)+'" data-v="'+i+'"><span><button class="mb'+(mute[i]?' on':'')+'" data-m="'+i+'">M</button><button class="mb'+(solo[i]?' on s':'')+'" data-s="'+i+'">S</button></span></div>').join('');
}
$('pm').addEventListener('input',e=>{if(e.target.dataset.v!=null)vol[+e.target.dataset.v]=e.target.value/100});
$('pm').addEventListener('click',e=>{
 const m=e.target.dataset.m,s=e.target.dataset.s;
 if(m!=null)mute[+m]=!mute[+m];else if(s!=null)solo[+s]=!solo[+s];else return;
 pintarMezcla();
});
const FXL=[['rev','Reverb'],['del','Eco'],['drv','Saturación'],['flt','Filtro']];
function pintarFx(){
 $('pfx').innerHTML='<div class="grupo" style="margin-top:0">Efectos globales</div>'+FXL.map(([k,n])=>'<div class="pf"><label>'+n+'</label><input type="range" min="0" max="100" value="'+fx[k]+'" data-f="'+k+'"><span id="fv-'+k+'">'+fx[k]+'</span></div>').join('');
}
$('pfx').addEventListener('input',e=>{
 const k=e.target.dataset.f;if(!k)return;
 fx[k]=+e.target.value;$('fv-'+k).textContent=fx[k];aplicarFx();
});
function pintarInfo(){$('info').innerHTML='<b>'+K.n+' · '+bpm+' bpm.</b> '+K.d}
function cargar(id){
 K=P.find(p=>p.id===id);bpm=K.b;sw=K.sw;
 fx={rev:K.fx[0],del:K.fx[1],drv:K.fx[2],flt:K.fx[3]};
 vol=VOL0.slice();mute=Array(7).fill(false);solo=Array(7).fill(false);
 vel=[];K.r.forEach((s,i)=>{vel[i]=[...s.padEnd(16,'.').slice(0,16)].map(ch=>i>4?(+ch||0):(V[ch]||0))});
 $('bpm').value=bpm;$('sw').value=sw;$('bpmv').textContent=bpm+' bpm';$('swv').textContent=sw+'%';
 pintarChips();pintarInfo();pintarGrid();pintarMezcla();pintarFx();aplicarFx();
}
$('bpm').addEventListener('input',e=>{bpm=+e.target.value;$('bpmv').textContent=bpm+' bpm';pintarInfo();aplicarFx()});
$('sw').addEventListener('input',e=>{sw=+e.target.value;$('swv').textContent=sw+'%'});
$('play').addEventListener('click',togglePlay);
$('reset').addEventListener('click',()=>cargar(K.id));
$('clear').addEventListener('click',()=>{vel=vel.map(r=>r.map(()=>0));pintarGrid()});
[['bm','pm','bf','pfx'],['bf','pfx','bm','pm']].forEach(([a,pa,b,pb])=>{
 $(a).addEventListener('click',()=>{
  const abierto=!$(pa).hidden;$(pa).hidden=abierto;$(a).setAttribute('aria-pressed',String(!abierto));
  if(!abierto){$(pb).hidden=true;$(b).setAttribute('aria-pressed','false')}
 });
});
