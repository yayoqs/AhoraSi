<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahora Sí — Series</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500;1,9..144,600&display=swap" rel="stylesheet">

<style>
:root {
  --papel:        #F7F1E8;
  --papel-2:      #EFE7DA;
  --papel-3:      #FCF8F0;
  --borde:        #E2D7C5;
  --borde-fuerte: #D2C4AC;
  --tinta:        #1F1B16;
  --tinta-suave:  #6B6155;
  --tinta-tenue:  #A89B87;

  --terracota: #C9613B;
  --mostaza:   #D9A421;
  --musgo:     #5A6B3E;
  --azul:      #4A6785;
  --ciruela:   #7A3E5C;
  --ciruela-papel: #EDDEE5;
  --rojo:      #A03737;

  --luci: #D89A9A;
  --yayo: #B8893C;
  --ambos: #7A8B6B;

  --accent: var(--ciruela);
  --accent-papel: var(--ciruela-papel);

  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 22px;
  --r-full: 999px;
  --sombra-1: 0 1px 2px rgba(31,27,22,.06);
  --sombra-2: 0 12px 28px rgba(31,27,22,.10);
  --fuente-titulo: 'Bricolage Grotesque', system-ui, sans-serif;
  --fuente-cuerpo: 'Figtree', system-ui, sans-serif;
  --fuente-carta:  'Fraunces', Georgia, serif;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
h1,h2,h3,h4,p,ul,ol,li { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button { background: none; border: none; cursor: pointer; font: inherit; color: inherit; }
img { display: block; max-width: 100%; }

body {
  font-family: var(--fuente-cuerpo);
  font-size: 15px;
  line-height: 1.5;
  color: var(--tinta);
  background: radial-gradient(ellipse at top, #2C2620 0%, #13100D 100%);
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  -webkit-font-smoothing: antialiased;
}
@media (max-width: 520px) { body { padding: 0; display: block; } }

.phone {
  width: 390px;
  height: 844px;
  max-height: calc(100vh - 48px);
  background: var(--papel);
  border-radius: 44px;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
  box-shadow:
    0 0 0 10px #0E0B08,
    0 0 0 12px #2A2318,
    0 30px 80px rgba(0,0,0,.55);
}
@media (max-width: 520px) {
  .phone { width: 100%; height: 100dvh; max-height: none; border-radius: 0; box-shadow: none; }
}

.screen-area {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: var(--papel);
  display: flex;
  flex-direction: column;
}
.screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }

/* ── TOPBAR ── */
.topbar {
  flex-shrink: 0;
  padding: 16px 20px 12px;
  background: var(--papel);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.topbar__eyebrow {
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--tinta-tenue);
  font-weight: 600;
  margin-bottom: 4px;
}
.topbar__title {
  font-family: var(--fuente-titulo);
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.035em;
  line-height: 1;
  color: var(--accent);
}
.topbar__btn {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: var(--r-full);
  color: var(--tinta-suave);
  flex-shrink: 0;
  margin-top: 2px;
}

/* ── SUBTABS ── */
.subtabs {
  display: flex;
  gap: 6px;
  padding: 0 20px 12px;
  background: var(--papel);
  flex-shrink: 0;
  border-bottom: 1px solid var(--borde);
}
.subtab {
  flex-shrink: 0;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--tinta-suave);
  border-radius: var(--r-full);
  transition: all .2s ease;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.subtab:hover { background: var(--papel-2); color: var(--tinta); }
.subtab.is-active { background: var(--tinta); color: var(--papel); }
.subtab__badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: var(--r-full);
  font-size: 10px;
  font-weight: 700;
  background: var(--papel-2);
  color: var(--tinta-suave);
  font-variant-numeric: tabular-nums;
}
.subtab.is-active .subtab__badge {
  background: rgba(247,241,232,.22);
  color: var(--papel);
}

/* ── CUERPO ── */
.screen__body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px 20px 120px;
  -webkit-overflow-scrolling: touch;
}
.screen__body::-webkit-scrollbar { width: 0; }

/* ══════════════════════════════════════════════
   BARRA SUPERIOR — Progreso + toggle vista
   ══════════════════════════════════════════════ */
.series-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px 12px 18px;
  background: var(--ciruela-papel);
  border: 1px solid color-mix(in oklab, var(--ciruela) 22%, var(--borde));
  border-radius: var(--r-md);
  margin-bottom: 12px;
}
.series-bar__progreso {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.series-bar__num {
  font-family: var(--fuente-titulo);
  font-weight: 800;
  font-size: 22px;
  letter-spacing: -0.035em;
  color: var(--ciruela);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.series-bar__num small {
  font-size: 14px;
  font-weight: 700;
  opacity: .55;
}
.series-bar__txt {
  font-size: 12px;
  color: color-mix(in oklab, var(--ciruela) 70%, var(--tinta));
  font-weight: 600;
}

.vista-toggle {
  display: flex;
  gap: 3px;
  padding: 3px;
  background: var(--papel-3);
  border-radius: var(--r-full);
}
.vista-toggle button {
  padding: 6px 12px;
  border-radius: var(--r-full);
  font-size: 11.5px;
  font-weight: 600;
  color: var(--tinta-suave);
  transition: all .15s ease;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.vista-toggle button svg { width: 13px; height: 13px; }
.vista-toggle button.is-active {
  background: var(--tinta);
  color: var(--papel);
}

/* ══════════════════════════════════════════════
   FILTROS
   ══════════════════════════════════════════════ */
.filtros {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  margin-bottom: 18px;
  margin-left: -20px;
  margin-right: -20px;
  padding: 0 20px;
}
.filtros::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 600;
  color: var(--tinta-suave);
  background: var(--papel-2);
  border: 1px solid var(--borde);
  border-radius: var(--r-full);
  transition: all .15s ease;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.chip:hover { background: var(--papel-3); }
.chip.is-active {
  background: var(--tinta);
  color: var(--papel);
  border-color: var(--tinta);
}
.chip__num {
  font-variant-numeric: tabular-nums;
  font-size: 10.5px;
  opacity: .65;
}
.chip.is-active .chip__num { opacity: .8; }

/* ══════════════════════════════════════════════
   AVISO RANKING (solo cuando filtros activos)
   ══════════════════════════════════════════════ */
.aviso-ranking {
  padding: 10px 14px;
  margin-bottom: 12px;
  background: color-mix(in oklab, var(--azul) 8%, var(--papel-2));
  border-left: 3px solid var(--azul);
  border-radius: var(--r-sm);
  color: color-mix(in oklab, var(--azul) 85%, var(--tinta));
  font-size: 12.5px;
  font-weight: 500;
  line-height: 1.5;
}

/* ══════════════════════════════════════════════
   SECCIÓN "VIENDO AHORA"
   ══════════════════════════════════════════════ */
.seccion-cab {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 12px;
  margin-top: 8px;
}
.seccion-cab__titulo {
  font-family: var(--fuente-titulo);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: .02em;
  color: var(--tinta);
  display: flex;
  align-items: center;
  gap: 8px;
}
.seccion-cab__punto {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--azul);
  animation: latido 2s ease-in-out infinite;
}
@keyframes latido {
  0%, 100% { opacity: 1; }
  50% { opacity: .4; }
}
.seccion-cab__linea {
  flex: 1;
  height: 1px;
  background: var(--borde);
}
.seccion-cab__count {
  font-size: 11px;
  font-weight: 600;
  color: var(--tinta-tenue);
  font-variant-numeric: tabular-nums;
}
.en-curso-lista { margin-bottom: 22px; }

/* ══════════════════════════════════════════════
   TARJETA DE SERIE — vista tarjeta
   ══════════════════════════════════════════════ */
.tarjeta {
  display: flex;
  gap: 14px;
  padding: 14px 16px 14px 14px;
  background: var(--papel-3);
  border: 1px solid var(--borde);
  border-left: 4px solid var(--borde-fuerte);
  border-radius: var(--r-md);
  margin-bottom: 10px;
  transition: border-color .15s ease;
}
.tarjeta--viendo    { border-left-color: var(--azul); }
.tarjeta--vista     { border-left-color: var(--musgo); }
.tarjeta--pendiente { border-left-color: var(--mostaza); }
.tarjeta--abandonada {
  border-left-color: var(--rojo);
  opacity: .72;
}

.tarjeta__caratula {
  width: 72px;
  height: 108px;
  border-radius: 8px;
  overflow: hidden;
  flex-shrink: 0;
  position: relative;
  background: var(--papel-2);
  display: grid;
  place-items: center;
  border: 1px solid var(--borde);
}
.tarjeta__caratula img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.tarjeta__caratula-letra {
  font-family: var(--fuente-titulo);
  font-weight: 800;
  font-size: 34px;
  letter-spacing: -0.05em;
  color: var(--tinta-tenue);
  opacity: .55;
}
.tarjeta__puntaje {
  position: absolute;
  bottom: -1px;
  right: -1px;
  padding: 3px 8px;
  font-family: var(--fuente-titulo);
  font-weight: 800;
  font-size: 15px;
  letter-spacing: -0.02em;
  background: var(--tinta);
  color: var(--papel);
  border-radius: 8px 0 8px 0;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.tarjeta--viendo    .tarjeta__puntaje { background: var(--azul); }
.tarjeta--vista     .tarjeta__puntaje { background: var(--musgo); }
.tarjeta--pendiente .tarjeta__puntaje { background: var(--mostaza); color: #3D2C0F; }
.tarjeta--abandonada .tarjeta__puntaje { background: var(--rojo); }

.tarjeta__cuerpo {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.tarjeta__cab {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}
.tarjeta__titulo {
  font-family: var(--fuente-titulo);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.012em;
  line-height: 1.2;
  color: var(--tinta);
  flex: 1;
  min-width: 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.tarjeta__badges {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  align-items: center;
}

.chip-tipo {
  padding: 2px 8px;
  border-radius: var(--r-full);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.chip-tipo--serie    { background: color-mix(in oklab, var(--ciruela) 14%, var(--papel-2)); color: var(--ciruela); }
.chip-tipo--pelicula { background: color-mix(in oklab, var(--terracota) 14%, var(--papel-2)); color: var(--terracota); }

.chip-estado {
  padding: 2px 8px;
  border-radius: var(--r-full);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.chip-estado--viendo     { background: color-mix(in oklab, var(--azul) 16%, var(--papel-2)); color: var(--azul); }
.chip-estado--vista      { background: color-mix(in oklab, var(--musgo) 16%, var(--papel-2)); color: var(--musgo); }
.chip-estado--pendiente  { background: color-mix(in oklab, var(--mostaza) 22%, var(--papel-2)); color: #8A6D0F; }
.chip-estado--abandonada { background: color-mix(in oklab, var(--rojo) 14%, var(--papel-2)); color: var(--rojo); }

.chip-cap {
  padding: 2px 8px;
  border-radius: var(--r-full);
  font-size: 10.5px;
  font-weight: 700;
  background: color-mix(in oklab, var(--azul) 12%, var(--papel-2));
  color: var(--azul);
  font-variant-numeric: tabular-nums;
  letter-spacing: .02em;
}

.tarjeta__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: var(--tinta-suave);
  line-height: 1.4;
}
.tarjeta__meta-sep { color: var(--tinta-tenue); }

.tarjeta__nota {
  font-family: var(--fuente-carta);
  font-style: italic;
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--tinta-suave);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Progreso de capítulo */
.progreso-cap {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-top: 4px;
}
.progreso-cap__texto {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--azul);
  font-variant-numeric: tabular-nums;
  letter-spacing: .02em;
}
.progreso-cap__texto b {
  font-family: var(--fuente-titulo);
  font-weight: 800;
  font-size: 12px;
}
.progreso-cap__barra {
  height: 3px;
  background: color-mix(in oklab, var(--azul) 15%, var(--papel-2));
  border-radius: var(--r-full);
  overflow: hidden;
}
.progreso-cap__barra i {
  display: block;
  height: 100%;
  background: var(--azul);
  border-radius: var(--r-full);
}

/* Acciones de la tarjeta */
.tarjeta__acciones {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 4px;
  padding-top: 10px;
  border-top: 1px dashed var(--borde);
}

.btn-mini {
  padding: 6px 11px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--tinta-suave);
  background: transparent;
  border: 1px solid var(--borde);
  border-radius: 6px;
  transition: all .15s ease;
  min-height: 30px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.btn-mini:hover { background: var(--papel-2); color: var(--tinta); }
.btn-mini--cap {
  background: color-mix(in oklab, var(--azul) 10%, transparent);
  border-color: color-mix(in oklab, var(--azul) 30%, var(--borde));
  color: var(--azul);
  font-family: var(--fuente-titulo);
  font-weight: 800;
}
.btn-mini--cap:hover { background: color-mix(in oklab, var(--azul) 20%, transparent); }
.btn-mini--link {
  color: var(--ciruela);
  border-color: color-mix(in oklab, var(--ciruela) 30%, var(--borde));
}
.btn-mini--link:hover { background: var(--ciruela-papel); color: var(--ciruela); }
.btn-mini--peligro:hover { background: #FBE9E9; color: var(--rojo); border-color: #E3B6B6; }

/* ══════════════════════════════════════════════
   VISTA COMPACTA — ranking
   ══════════════════════════════════════════════ */
.fila {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: var(--papel-3);
  border: 1px solid var(--borde);
  border-left: 4px solid var(--borde-fuerte);
  border-radius: var(--r-md);
  margin-bottom: 8px;
  touch-action: pan-y;
  transition: box-shadow .15s ease, transform .15s ease;
}
.fila--viendo    { border-left-color: var(--azul); }
.fila--vista     { border-left-color: var(--musgo); }
.fila--pendiente { border-left-color: var(--mostaza); }
.fila--abandonada { border-left-color: var(--rojo); opacity: .7; }

.fila--arrastrando {
  background: var(--papel);
  box-shadow: var(--sombra-2);
  border-color: var(--ciruela);
  transform: scale(1.02);
  z-index: 10;
  position: relative;
}

.fila__handle {
  width: 20px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--tinta-tenue);
  cursor: grab;
  font-size: 14px;
  letter-spacing: -.08em;
  line-height: 1;
  user-select: none;
  touch-action: none;
  flex-shrink: 0;
}
.fila__handle:active { cursor: grabbing; }
.fila__handle--off { opacity: .25; cursor: not-allowed; }

.fila__pos {
  font-family: var(--fuente-titulo);
  font-weight: 800;
  font-size: 13px;
  color: var(--tinta-tenue);
  min-width: 18px;
  text-align: center;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

.fila__cuerpo {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.fila__titulo {
  font-family: var(--fuente-titulo);
  font-weight: 700;
  font-size: 14.5px;
  letter-spacing: -0.01em;
  color: var(--tinta);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
}
.fila__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--tinta-suave);
}

.fila__puntaje {
  font-family: var(--fuente-titulo);
  font-weight: 800;
  font-size: 24px;
  letter-spacing: -0.045em;
  color: var(--ciruela);
  min-width: 34px;
  text-align: right;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}
.fila__puntaje--vacio {
  color: var(--tinta-tenue);
  font-weight: 500;
  font-size: 18px;
}

.fila__acciones {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}

/* ══════════════════════════════════════════════
   VACÍO
   ══════════════════════════════════════════════ */
.vacio-caja {
  padding: 40px 24px;
  background: var(--papel-2);
  border: 1px dashed var(--borde-fuerte);
  border-radius: var(--r-lg);
  text-align: center;
}
.vacio-caja__emoji {
  font-size: 38px;
  line-height: 1;
  margin-bottom: 12px;
}
.vacio-caja__titulo {
  font-family: var(--fuente-titulo);
  font-weight: 700;
  font-size: 17px;
  letter-spacing: -0.015em;
  color: var(--tinta);
  margin-bottom: 6px;
}
.vacio-caja__texto {
  font-size: 13.5px;
  color: var(--tinta-suave);
  line-height: 1.55;
}

/* ── FAB ── */
.fab {
  position: absolute;
  bottom: 92px;
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: var(--r-full);
  background: var(--ciruela);
  color: var(--papel);
  display: grid;
  place-items: center;
  box-shadow: 0 12px 28px color-mix(in oklab, var(--ciruela) 45%, transparent);
  z-index: 40;
  transition: transform .15s ease;
}
.fab:active { transform: scale(.9); }
.fab svg { width: 24px; height: 24px; }

/* ── TABBAR ── */
.tabbar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 78px;
  padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
  background: rgba(247, 241, 232, .94);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--borde);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  z-index: 50;
}
.tabbar__item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--tinta-tenue);
  opacity: .55;
  padding: 4px;
  border-radius: var(--r-md);
  transition: all .18s ease;
}
.tabbar__item svg { width: 22px; height: 22px; }
.tabbar__label { font-size: 10px; font-weight: 600; }
.tabbar__item.activo { color: var(--ciruela); opacity: 1; }
.tabbar__item.activo .tabbar__label { font-weight: 700; }

/* ── TOAST ── */
.toast {
  position: absolute;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  padding: 10px 18px;
  background: var(--tinta);
  color: var(--papel);
  border-radius: var(--r-full);
  font-size: 12px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
  z-index: 1200;
  box-shadow: var(--sombra-2);
  white-space: nowrap;
}
.toast.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── DEBUG NAV ── */
.debug-nav {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.debug-nav__label {
  font-size: 9px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: rgba(255,255,255,.4);
  font-weight: 700;
}
.debug-nav__btns {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 4px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: var(--r-md);
  backdrop-filter: blur(12px);
}
.debug-nav__btns button {
  padding: 7px 12px;
  font-size: 10.5px;
  font-weight: 600;
  color: rgba(255,255,255,.55);
  border-radius: 6px;
  text-align: left;
  transition: all .15s ease;
}
.debug-nav__btns button.is-active { background: rgba(255,255,255,.15); color: #fff; }
@media (max-width: 720px) { .debug-nav { display: none; } }
</style>
</head>

<script>
(function () {
  'use strict';

  /* ═══════════════════════════════════════════════════
     DATOS
     ═══════════════════════════════════════════════════ */
  const DATOS_LLENO = [
    {
      id: 's1', titulo: 'Dark', tipo: 'serie', estado: 'vista',
      puntuacion: 9, posicion: 1,
      temporadaActual: 3, capituloActual: 8, totalTemporadas: 3, totalCapitulosTemporada: 8,
      nota: 'Enredada pero vale la pena. La temporada 2 es la mejor.',
      donde: 'Netflix', recomendadaPor: 'Nico', autor: 'yayo',
    },
    {
      id: 's2', titulo: 'Dune: Parte 2', tipo: 'pelicula', estado: 'vista',
      puntuacion: 8, posicion: 2,
      nota: 'Impresionante en el cine. En casa pierde un poco.',
      donde: 'Cine', recomendadaPor: '', autor: 'yayo',
    },
    {
      id: 's3', titulo: 'Severance', tipo: 'serie', estado: 'viendo',
      puntuacion: 9, posicion: 3,
      temporadaActual: 2, capituloActual: 5, totalTemporadas: 2, totalCapitulosTemporada: 10,
      nota: 'Vamos por la mitad. Nos tiene enganchados.',
      donde: 'Apple TV', recomendadaPor: 'Nico', autor: 'luci',
    },
    {
      id: 's4', titulo: 'Shogun', tipo: 'serie', estado: 'viendo',
      puntuacion: null, posicion: 4,
      temporadaActual: 1, capituloActual: 4, totalTemporadas: 1, totalCapitulosTemporada: 10,
      nota: '',
      donde: 'Disney+', recomendadaPor: '', autor: 'ambos',
    },
    {
      id: 's5', titulo: 'Cien años de soledad', tipo: 'serie', estado: 'pendiente',
      puntuacion: null, posicion: 5,
      totalTemporadas: 1, totalCapitulosTemporada: 8,
      nota: '', donde: 'Netflix', recomendadaPor: '', autor: 'yayo',
    },
    {
      id: 's6', titulo: 'El Señor de los Anillos: Los Anillos de Poder', tipo: 'serie', estado: 'abandonada',
      puntuacion: 4, posicion: 6,
      temporadaActual: 1, capituloActual: 3, totalTemporadas: 2, totalCapitulosTemporada: 8,
      nota: 'No nos enganchó. La dejamos en el capítulo 3.',
      donde: 'Prime', recomendadaPor: '', autor: 'yayo',
    },
  ];

  let datos = JSON.parse(JSON.stringify(DATOS_LLENO));
  let vista = 'tarjeta';
  let filtro = 'todas';

  /* ═══════════════════════════════════════════════════
     HELPERS
     ═══════════════════════════════════════════════════ */
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => Array.from(document.querySelectorAll(s));

  function etiquetaTipo(id) {
    return id === 'serie' ? 'Serie' : 'Película';
  }
  function inicial(titulo) {
    return (titulo || '?').trim().charAt(0).toUpperCase();
  }
  function tieneSeguimiento(it) {
    return it.tipo === 'serie' && it.temporadaActual != null && it.capituloActual != null;
  }
  function etiquetaCap(it) {
    return `T${it.temporadaActual} · E${it.capituloActual}`;
  }
  function autorHTML(id) {
    if (id === 'luci') return '<span class="autor autor--luci"><span class="autor__ini">L</span></span>';
    if (id === 'yayo') return '<span class="autor autor--yayo"><span class="autor__ini">Y</span></span>';
    return '<span class="autor autor--ambos"><span class="autor__ini">A</span></span>';
  }

  /* ═══════════════════════════════════════════════════
     FILTROS
     ═══════════════════════════════════════════════════ */
  function opcionesFiltro() {
    return [
      { id: 'todas', etiqueta: 'Todas', num: datos.length },
      { id: 'viendo', etiqueta: 'Viendo', num: datos.filter((d) => d.estado === 'viendo').length },
      { id: 'pendiente', etiqueta: 'Pendientes', num: datos.filter((d) => d.estado === 'pendiente').length },
      { id: 'vista', etiqueta: 'Vistas', num: datos.filter((d) => d.estado === 'vista').length },
      { id: 'serie', etiqueta: 'Series', num: datos.filter((d) => d.tipo === 'serie').length },
      { id: 'pelicula', etiqueta: 'Películas', num: datos.filter((d) => d.tipo === 'pelicula').length },
    ];
  }

  function itemsFiltrados() {
    let base = datos.slice();
    if (filtro === 'serie' || filtro === 'pelicula') {
      base = base.filter((d) => d.tipo === filtro);
    } else if (filtro !== 'todas') {
      base = base.filter((d) => d.estado === filtro);
    }
    if (vista === 'ranking') {
      base.sort((a, b) => (a.posicion ?? 9999) - (b.posicion ?? 9999));
    } else {
      // En tarjeta: por orden de creación descendente (más nuevas primero)
      base.sort((a, b) => (b.id > a.id ? 1 : -1));
    }
    return base;
  }

  function enCurso() {
    return datos.filter((d) => d.tipo === 'serie' && d.estado === 'viendo');
  }

  /* ═══════════════════════════════════════════════════
     PINTAR
     ═══════════════════════════════════════════════════ */
  function pintarFiltros() {
    const cont = $('#filtros');
    cont.innerHTML = '';
    for (const f of opcionesFiltro()) {
      const chip = document.createElement('button');
      chip.className = 'chip' + (filtro === f.id ? ' is-active' : '');
      chip.innerHTML = `${f.etiqueta} <span class="chip__num">${f.num}</span>`;
      chip.addEventListener('click', () => {
        filtro = f.id;
        pintar();
      });
      cont.appendChild(chip);
    }
  }

  function pintarProgreso() {
    const total = datos.length;
    const vistas = datos.filter((d) => d.estado === 'vista').length;
    $('#progNum').innerHTML = `${vistas}<small>/${total}</small>`;
  }

  function pintarAvisoRanking() {
    const cont = $('#avisoRanking');
    cont.innerHTML = '';
    if (vista === 'ranking' && filtro !== 'todas') {
      const div = document.createElement('div');
      div.className = 'aviso-ranking';
      div.textContent = 'Quita los filtros para poder reordenar el ranking.';
      cont.appendChild(div);
    }
  }

  function pintarEnCurso() {
    const cont = $('#enCurso');
    cont.innerHTML = '';
    if (filtro !== 'todas') return;
    const lista = enCurso();
    if (lista.length === 0) return;

    const cab = document.createElement('div');
    cab.className = 'seccion-cab';
    cab.innerHTML = `
      <span class="seccion-cab__titulo">
        <span class="seccion-cab__punto"></span>
        Viendo ahora
      </span>
      <span class="seccion-cab__linea"></span>
      <span class="seccion-cab__count">${lista.length}</span>
    `;
    cont.appendChild(cab);

    const contenedor = document.createElement('div');
    contenedor.className = 'en-curso-lista';
    for (const it of lista) {
      contenedor.appendChild(vista === 'ranking' ? pintarFila(it, true) : pintarTarjeta(it, true));
    }
    cont.appendChild(contenedor);
  }

  function pintar() {
    pintarFiltros();
    pintarProgreso();
    pintarAvisoRanking();
    pintarEnCurso();

    const lista = $('#lista');
    lista.innerHTML = '';

    let items = itemsFiltrados();
    // Si estamos en "todas", las que están viendo ya salieron arriba
    if (filtro === 'todas') {
      items = items.filter((d) => !(d.tipo === 'serie' && d.estado === 'viendo'));
    }

    if (items.length === 0) {
      const vacia = document.createElement('div');
      vacia.className = 'vacio-caja';
      vacia.innerHTML = `
        <div class="vacio-caja__emoji">🎬</div>
        <p class="vacio-caja__titulo">Sin títulos acá</p>
        <p class="vacio-caja__texto">${filtro === 'todas'
          ? 'Todavía no hay nada anotado. Empieza por el botón + abajo.'
          : 'Este filtro no tiene títulos. Prueba con otro.'}</p>
      `;
      lista.appendChild(vacia);
      return;
    }

    for (const it of items) {
      lista.appendChild(vista === 'ranking' ? pintarFila(it) : pintarTarjeta(it));
    }
  }

  /* ── Tarjeta ── */
  function pintarTarjeta(it, esEnCurso = false) {
    const conSeg = tieneSeguimiento(it);
    const pct = it.puntuacion ? (it.puntuacion / 10) * 100 : 0;

    const el = document.createElement('article');
    el.className = 'tarjeta tarjeta--' + it.estado;
    el.dataset.id = it.id;

    // Carátula con letra o futura imagen
    const caratula = document.createElement('div');
    caratula.className = 'tarjeta__caratula';
    caratula.innerHTML = `<span class="tarjeta__caratula-letra">${inicial(it.titulo)}</span>`;
    if (it.puntuacion != null) {
      const punt = document.createElement('span');
      punt.className = 'tarjeta__puntaje';
      punt.textContent = String(it.puntuacion);
      caratula.appendChild(punt);
    }
    el.appendChild(caratula);

    // Cuerpo
    const cuerpo = document.createElement('div');
    cuerpo.className = 'tarjeta__cuerpo';

    // Título
    const titulo = document.createElement('h3');
    titulo.className = 'tarjeta__titulo';
    titulo.textContent = it.titulo;
    cuerpo.appendChild(titulo);

    // Badges: tipo + estado + cap (si aplica)
    const badges = document.createElement('div');
    badges.className = 'tarjeta__badges';
    badges.innerHTML = `
      <span class="chip-tipo chip-tipo--${it.tipo}">${etiquetaTipo(it.tipo)}</span>
      <span class="chip-estado chip-estado--${it.estado}">${
        it.estado === 'viendo' ? 'Viendo' :
        it.estado === 'vista' ? 'Vista' :
        it.estado === 'pendiente' ? 'Pendiente' : 'Abandonada'
      }</span>
      ${conSeg && esEnCurso ? `<span class="chip-cap">${etiquetaCap(it)}</span>` : ''}
    `;
    cuerpo.appendChild(badges);

    // Meta: dónde · quién recomendó · autor
    const meta = document.createElement('div');
    meta.className = 'tarjeta__meta';
    const partes = [];
    if (it.donde) partes.push(`<span>${it.donde}</span>`);
    if (it.recomendadaPor) partes.push(`<span>· Nico? ${it.recomendadaPor}</span>`.replace('Nico? ', ''));
    meta.innerHTML = partes.join(' <span class="tarjeta__meta-sep">·</span> ') + ` ${autorHTML(it.autor)}`;
    cuerpo.appendChild(meta);

    // Nota
    if (it.nota) {
      const nota = document.createElement('p');
      nota.className = 'tarjeta__nota';
      nota.textContent = it.nota;
      cuerpo.appendChild(nota);
    }

    // Progreso de capítulo (solo viendo con seguimiento)
    if (conSeg && esEnCurso && it.totalCapitulosTemporada) {
      const pctCap = Math.min(100, (it.capituloActual / it.totalCapitulosTemporada) * 100);
      const prog = document.createElement('div');
      prog.className = 'progreso-cap';
      prog.innerHTML = `
        <div class="progreso-cap__texto">
          <span>Temporada ${it.temporadaActual} · capítulo ${it.capituloActual} de ${it.totalCapitulosTemporada}</span>
          <b>${Math.round(pctCap)}%</b>
        </div>
        <div class="progreso-cap__barra"><i style="width:${pctCap}%"></i></div>
      `;
      cuerpo.appendChild(prog);
    } else if (it.estado === 'vista' && it.puntuacion != null) {
      // Barra de puntuación simple para vistas
      const prog = document.createElement('div');
      prog.className = 'progreso-cap';
      prog.innerHTML = `
        <div class="progreso-cap__barra" style="background: color-mix(in oklab, var(--musgo) 15%, var(--papel-2));">
          <i style="width:${pct}%; background: var(--musgo);"></i>
        </div>
      `;
      cuerpo.appendChild(prog);
    }

    // Acciones
    const acciones = document.createElement('div');
    acciones.className = 'tarjeta__acciones';
    if (it.link) {
      const a = document.createElement('a');
      a.className = 'btn-mini btn-mini--link';
      a.href = it.link;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = 'Ver';
      acciones.appendChild(a);
    }
    if (conSeg && esEnCurso) {
      const btn = document.createElement('button');
      btn.className = 'btn-mini btn-mini--cap';
      btn.textContent = '+1 cap.';
      btn.addEventListener('click', (e) => { e.stopPropagation(); avanzarCapitulo(it.id); });
      acciones.appendChild(btn);
    }
    const btnEdit = document.createElement('button');
    btnEdit.className = 'btn-mini';
    btnEdit.textContent = 'Editar';
    btnEdit.addEventListener('click', (e) => { e.stopPropagation(); mostrarToast('Abriría el formulario'); });
    acciones.appendChild(btnEdit);

    const btnMore = document.createElement('button');
    btnMore.className = 'btn-mini btn-mini--peligro';
    btnMore.textContent = 'Quitar';
    btnMore.style.marginLeft = 'auto';
    btnMore.addEventListener('click', (e) => { e.stopPropagation(); mostrarToast('Confirmaría quitar'); });
    acciones.appendChild(btnMore);

    cuerpo.appendChild(acciones);
    el.appendChild(cuerpo);

    return el;
  }

  /* ── Fila ranking ── */
  function pintarFila(it, esEnCurso = false) {
    const conSeg = tieneSeguimiento(it);
    const puedeArrastrar = filtro === 'todas';

    const el = document.createElement('article');
    el.className = 'fila fila--' + it.estado;
    el.dataset.id = it.id;

    // Handle
    const handle = document.createElement('span');
    handle.className = 'fila__handle' + (puedeArrastrar ? '' : ' fila__handle--off');
    handle.textContent = '⠿';
    if (puedeArrastrar) {
      handle.addEventListener('pointerdown', (e) => iniciarArrastre(e, it.id));
    }
    el.appendChild(handle);

    // Posición
    const pos = document.createElement('span');
    pos.className = 'fila__pos';
    pos.textContent = it.posicion != null ? String(it.posicion) : '—';
    el.appendChild(pos);

    // Cuerpo
    const cuerpo = document.createElement('div');
    cuerpo.className = 'fila__cuerpo';

    const titulo = document.createElement('div');
    titulo.className = 'fila__titulo';
    titulo.textContent = it.titulo;
    cuerpo.appendChild(titulo);

    const meta = document.createElement('div');
    meta.className = 'fila__meta';
    const cap = conSeg && esEnCurso ? `<span class="chip-cap">${etiquetaCap(it)}</span>` :
      `<span class="chip-estado chip-estado--${it.estado}">${
        it.estado === 'viendo' ? 'Viendo' :
        it.estado === 'vista' ? 'Vista' :
        it.estado === 'pendiente' ? 'Pendiente' : 'Abandonada'
      }</span>`;
    meta.innerHTML = `
      <span class="chip-tipo chip-tipo--${it.tipo}">${etiquetaTipo(it.tipo)}</span>
      ${cap}
      ${it.donde ? `<span>${it.donde}</span>` : ''}
      ${autorHTML(it.autor)}
    `;
    cuerpo.appendChild(meta);
    el.appendChild(cuerpo);

    // Puntaje grande
    const punt = document.createElement('span');
    punt.className = 'fila__puntaje' + (it.puntuacion == null ? ' fila__puntaje--vacio' : '');
    punt.textContent = it.puntuacion != null ? String(it.puntuacion) : '—';
    el.appendChild(punt);

    // Acciones
    const acciones = document.createElement('div');
    acciones.className = 'fila__acciones';
    if (conSeg && esEnCurso) {
      const btn = document.createElement('button');
      btn.className = 'btn-mini btn-mini--cap';
      btn.textContent = '+1';
      btn.addEventListener('click', (e) => { e.stopPropagation(); avanzarCapitulo(it.id); });
      acciones.appendChild(btn);
    }
    el.appendChild(acciones);

    return el;
  }

  /* ═══════════════════════════════════════════════════
     ACCIONES
     ═══════════════════════════════════════════════════ */
  function avanzarCapitulo(id) {
    const it = datos.find((d) => d.id === id);
    if (!it) return;
    const cap = (it.capituloActual || 0) + 1;
    const total = it.totalCapitulosTemporada;
    if (total && cap > total) {
      const temp = it.temporadaActual || 1;
      const totalTemp = it.totalTemporadas;
      if (totalTemp && temp >= totalTemp) {
        it.estado = 'vista';
        mostrarToast('Última temporada terminada. Marcada como vista.');
      } else {
        it.temporadaActual = temp + 1;
        it.capituloActual = 1;
        mostrarToast(`Temporada ${temp + 1}, capítulo 1`);
      }
    } else {
      it.capituloActual = cap;
      mostrarToast(`T${it.temporadaActual} · E${cap}`);
    }
    pintar();
  }

  /* ═══════════════════════════════════════════════════
     DRAG & DROP
     ═══════════════════════════════════════════════════ */
  let arrastrando = null;
  let pointerIdActivo = null;

  function iniciarArrastre(ev, id) {
    if (filtro !== 'todas') return;
    const fila = ev.target.closest('.fila');
    if (!fila) return;
    ev.preventDefault();

    arrastrando = { id, fila };
    pointerIdActivo = ev.pointerId;
    fila.classList.add('fila--arrastrando');
    fila.setPointerCapture(ev.pointerId);

    fila.addEventListener('pointermove', manejarArrastre);
    fila.addEventListener('pointerup', soltarArrastre);
    fila.addEventListener('pointercancel', soltarArrastre);
  }

  function manejarArrastre(ev) {
    if (!arrastrando) return;
    const { fila } = arrastrando;
    const lista = fila.parentNode;
    if (!lista) return;
    const y = ev.clientY;
    const otras = [...lista.querySelectorAll('.fila:not(.fila--arrastrando)')];
    let insertado = false;
    for (const otra of otras) {
      const rect = otra.getBoundingClientRect();
      const medio = rect.top + rect.height / 2;
      if (y < medio) {
        if (fila.nextElementSibling !== otra) lista.insertBefore(fila, otra);
        insertado = true;
        break;
      }
    }
    if (!insertado && lista.lastElementChild !== fila) lista.appendChild(fila);
  }

  function soltarArrastre() {
    if (!arrastrando) return;
    const { fila } = arrastrando;
    fila.classList.remove('fila--arrastrando');
    fila.removeEventListener('pointermove', manejarArrastre);
    fila.removeEventListener('pointerup', soltarArrastre);
    fila.removeEventListener('pointercancel', soltarArrastre);
    try { fila.releasePointerCapture(pointerIdActivo); } catch (e) {}

    const lista = fila.parentNode;
    const filas = [...lista.querySelectorAll('.fila')];
    let i = 1;
    for (const el of filas) {
      const d = datos.find((x) => x.id === el.dataset.id);
      if (d) { d.posicion = i; el.querySelector('.fila__pos').textContent = String(i); }
      i++;
    }
    arrastrando = null;
    pointerIdActivo = null;
    mostrarToast('Ranking actualizado');
  }

  /* ═══════════════════════════════════════════════════
     TOGGLE VISTA
     ═══════════════════════════════════════════════════ */
  $$('#vistaToggle button').forEach((b) => {
    b.addEventListener('click', () => {
      vista = b.dataset.vista;
      $$('#vistaToggle button').forEach((x) => x.classList.toggle('is-active', x === b));
      pintar();
    });
  });

  /* ═══════════════════════════════════════════════════
     DEBUG
     ═══════════════════════════════════════════════════ */
  $$('#debugNav button').forEach((b) => {
    b.addEventListener('click', () => {
      $$('#debugNav button').forEach((x) => x.classList.toggle('is-active', x === b));
      if (b.dataset.demo === 'vacio') {
        datos = [];
      } else {
        datos = JSON.parse(JSON.stringify(DATOS_LLENO));
      }
      filtro = 'todas';
      pintar();
    });
  });

  /* ═══════════════════════════════════════════════════
     FAB Y TABBAR
     ═══════════════════════════════════════════════════ */
  $('#fab').addEventListener('click', () => mostrarToast('Abriría el formulario'));

  document.querySelectorAll('.tabbar__item').forEach((item) => {
    item.addEventListener('click', () => {
      if (item.classList.contains('activo')) return;
      mostrarToast('Próximamente');
    });
  });

  /* ═══════════════════════════════════════════════════
     TOAST
     ═══════════════════════════════════════════════════ */
  const toast = $('#toast');
  let toastTimer;
  function mostrarToast(texto) {
    toast.textContent = texto;
    toast.classList.add('is-visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 1800);
  }

  /* ═══════════════════════════════════════════════════
     INIT
     ═══════════════════════════════════════════════════ */
  pintar();
})();
</script>

</body>
</html>
