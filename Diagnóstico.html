<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Viewport corregido para bloquear el auto-escalado de Acode -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  html {
    -webkit-text-size-adjust: 100%; /* Forzar escala real en el WebView de Acode */
    text-size-adjust: 100%;
  }
  body { 
    margin: 0; 
    padding: 20px; 
    font-family: system-ui, sans-serif; 
  }
  p { 
    margin: 0 0 12px; 
  }
</style>
</head>
<body>
<p style="font-size: 12px;">12px — texto chico</p>
<p style="font-size: 16px;">16px — texto base</p>
<p style="font-size: 20px;">20px — texto mediano</p>
<p style="font-size: 24px;">24px — texto grande</p>
<p style="font-size: 32px;">32px — texto extra</p>
</body>
</html>
